[project]
name = "zevra-intel-worker"
version = "0.1.0"
description = "Zevra intelligence worker: OCR bill extraction, buyer-mail triage, vernacular floor-bot parsing and backhaul ranking."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "pdfplumber>=0.11", "Pillow>=11"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
